<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
    }

    .game-container {
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #00d2ff;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .score-board {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    .score-board span {
      color: #ffd700;
    }

    canvas {
      border: 2px solid #00d2ff;
      border-radius: 4px;
      background: #16213e;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
    }

    .instructions {
      margin-top: 15px;
      color: #888;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 4px;
    }

    .overlay h2 {
      font-size: 2rem;
      color: #ff6b6b;
      margin-bottom: 10px;
    }

    .overlay p {
      font-size: 1.1rem;
      color: #ccc;
    }

    .canvas-wrapper {
      position: relative;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Snake Game</h1>
    <div class="score-board">
      <div>Score: <span id="score">0</span></div>
      <div>High Score: <span id="high-score">0</span></div>
    </div>
    <div class="canvas-wrapper">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay" id="start-screen">
        <h2 style="color: #00d2ff;">Snake Game</h2>
        <p>Press any arrow key or tap to start</p>
      </div>
      <div class="overlay" id="game-over-screen" style="display: none;">
        <h2>Game Over!</h2>
        <p>Score: <span id="final-score">0</span></p>
        <p style="margin-top: 8px;">Press any key or tap to restart</p>
      </div>
    </div>
    <div class="instructions">
      Arrow keys / WASD to move<br>
      Eat the red food to grow and score points!
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const finalScoreEl = document.getElementById('final-score');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake, food, direction, nextDirection, score, highScore, gameLoop, gameState;

    highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
    highScoreEl.textContent = highScore;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      placeFood();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * TILE_COUNT),
          y: Math.floor(Math.random() * TILE_COUNT)
        };
      } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
    }

    function update() {
      direction = { ...nextDirection };

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        endGame();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid lines (subtle)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i < TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      // Draw food
      ctx.fillStyle = '#ff6b6b';
      ctx.shadowColor = '#ff6b6b';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        GRID_SIZE / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw snake
      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length;
        const r = Math.floor(0 + ratio * 0);
        const g = Math.floor(180 + ratio * 75);
        const b = Math.floor(100 + ratio * 155);
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;

        const padding = i === 0 ? 1 : 2;
        ctx.fillRect(
          seg.x * GRID_SIZE + padding,
          seg.y * GRID_SIZE + padding,
          GRID_SIZE - padding * 2,
          GRID_SIZE - padding * 2
        );

        // Eyes on head
        if (i === 0) {
          ctx.fillStyle = '#fff';
          const eyeSize = 3;
          let ex1, ey1, ex2, ey2;
          const cx = seg.x * GRID_SIZE + GRID_SIZE / 2;
          const cy = seg.y * GRID_SIZE + GRID_SIZE / 2;

          if (direction.x === 1) { ex1 = cx + 4; ey1 = cy - 4; ex2 = cx + 4; ey2 = cy + 4; }
          else if (direction.x === -1) { ex1 = cx - 4; ey1 = cy - 4; ex2 = cx - 4; ey2 = cy + 4; }
          else if (direction.y === -1) { ex1 = cx - 4; ey1 = cy - 4; ex2 = cx + 4; ey2 = cy - 4; }
          else { ex1 = cx - 4; ey1 = cy + 4; ex2 = cx + 4; ey2 = cy + 4; }

          ctx.beginPath();
          ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function gameStep() {
      update();
      if (gameState === 'playing') {
        draw();
      }
    }

    function startGame() {
      gameState = 'playing';
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';
      init();
      draw();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(gameStep, 120);
    }

    function endGame() {
      gameState = 'gameover';
      clearInterval(gameLoop);
      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        localStorage.setItem('snakeHighScore', highScore);
      }
      finalScoreEl.textContent = score;
      gameOverScreen.style.display = 'flex';
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (gameState === 'waiting' || gameState === 'gameover') {
        startGame();
        return;
      }

      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
          if (direction.y === 0) nextDirection = { x: 0, y: -1 };
          break;
        case 'ArrowDown': case 's': case 'S':
          if (direction.y === 0) nextDirection = { x: 0, y: 1 };
          break;
        case 'ArrowLeft': case 'a': case 'A':
          if (direction.x === 0) nextDirection = { x: -1, y: 0 };
          break;
        case 'ArrowRight': case 'd': case 'D':
          if (direction.x === 0) nextDirection = { x: 1, y: 0 };
          break;
      }
    });

    // Touch controls
    let touchStartX, touchStartY;
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'waiting' || gameState === 'gameover') {
        startGame();
        return;
      }
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!touchStartX || !touchStartY || gameState !== 'playing') return;

      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;

      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && direction.x === 0) nextDirection = { x: 1, y: 0 };
        else if (dx < 0 && direction.x === 0) nextDirection = { x: -1, y: 0 };
      } else {
        if (dy > 0 && direction.y === 0) nextDirection = { x: 0, y: 1 };
        else if (dy < 0 && direction.y === 0) nextDirection = { x: 0, y: -1 };
      }

      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    // Initial state
    gameState = 'waiting';
    init();
    draw();
  </script>
</body>
</html>
